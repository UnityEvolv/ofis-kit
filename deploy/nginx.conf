# The app container: static files, and a way through to the server.
#
# The app and the server are separate containers but must look like one origin
# to the browser, or every socket connection becomes a CORS negotiation and the
# app needs to be told where the server lives. Forwarding four paths is cheaper
# than either.

upstream office {
    # The compose service name. Nothing here is a hostname anybody configures;
    # it is the name of the container next to this one.
    server ofiskit-server:4000;
}

server {
    listen 8080;
    server_name _;

    # Never let a stale index.html point at hashed assets that no longer exist.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Hashed file names, so these can be cached hard and forever.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The socket. The upgrade headers are what make this a WebSocket rather
    # than a very disappointing HTTP request.
    location /socket {
        proxy_pass http://office;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A socket that is quiet between heartbeats is not an idle socket.
        proxy_read_timeout 1h;
    }

    # What the app asks the office: its configuration, the office state, the
    # template, and the background image the map is drawn on.
    location ~ ^/(config|v1|office)/? {
        proxy_pass http://office;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else is the app, and any path it knows about — /builder, say —
    # is a route it resolves itself.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
